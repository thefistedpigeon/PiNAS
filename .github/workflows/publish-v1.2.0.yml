name: Publish PiNAS v1.2.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.2.0.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pinas-release-v1.2.0
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'thefistedpigeon/PiNAS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release branch and version
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          grep -Fx "VERSION='1.2.0'" <(grep '^VERSION=' pinas.py)
          grep -Fx "VERSION='1.2.0'" <(grep '^VERSION=' src/pinas/core.py)
          test -s docs/releases/v1.2.0.md
          test -s assets/fonts/LICENSE-ClearSans.txt
          test -s assets/fonts/LICENSE-SourceCodePro.md
      - name: Verify standalone bundle is reproducible
        run: python3 tools/build_release.py --check
      - name: Compile source, bundle and tests
        run: python3 -m compileall -q src/pinas pinas.py tools tests
      - name: Run complete regression suite
        run: python3 -m unittest discover -s tests -v
      - name: Install targeted lint checker
        run: python3 -m pip install --disable-pip-version-check ruff==0.14.4
      - name: Verify critical correctness
        run: ruff check --select E9,F63,F7,F82 --ignore F821 src/pinas tools
      - name: Generate SHA-256 checksum
        run: sha256sum pinas.py > pinas.py.sha256
      - name: Publish official GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.2.0 >/dev/null 2>&1; then
            echo "v1.2.0 already exists; refusing to overwrite published assets."
            exit 1
          fi
          gh release create v1.2.0 pinas.py pinas.py.sha256 \
            --target "$GITHUB_SHA" \
            --title "PiNAS v1.2.0 — Official Release" \
            --notes-file docs/releases/v1.2.0.md \
            --latest
      - name: Verify published release and assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.2.0 --json assets --jq '.assets[].name' | grep -Fx pinas.py
          gh release view v1.2.0 --json assets --jq '.assets[].name' | grep -Fx pinas.py.sha256
