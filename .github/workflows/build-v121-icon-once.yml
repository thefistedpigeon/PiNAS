name: Rebuild PiNAS v1.2.1 with supplied eye icon
on:
  push:
    branches: [release/v1.2.1-login-password-visibility]
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate standalone PiNAS package
        run: python3 tools/build_release.py
      - name: Validate Python, JS, bundle and all regressions
        run: |
          python3 tools/build_release.py --check
          python3 -m compileall -q src/pinas pinas.py tools tests
          python3 -m unittest discover -s tests -v
      - name: Commit rebuilt package
        run: |
          git add pinas.py
          if git diff --cached --quiet; then
            echo 'Bundle is already up-to-date.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Rebuild PiNAS v1.2.1 with supplied reveal eye icon'
          git push origin HEAD:release/v1.2.1-login-password-visibility
