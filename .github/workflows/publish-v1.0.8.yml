name: Publish PiNAS v1.0.8

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v1.0.8.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pinas-release-v1.0.8
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'thefistedpigeon/PiNAS'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify release version and notes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fx "VERSION='1.0.8'" <(grep '^VERSION=' pinas.py)
          grep -Fx "VERSION='1.0.8'" <(grep '^VERSION=' src/pinas/core.py)
          test -s docs/releases/v1.0.8.md
      - name: Verify standalone installer matches sources
        run: python3 tools/build_release.py --check
      - name: Compile Python files
        run: python3 -m compileall -q src/pinas pinas.py tools tests
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v
      - name: Generate SHA-256 checksum
        run: sha256sum pinas.py > pinas.py.sha256
      - name: Publish official GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.8 >/dev/null 2>&1; then
            echo "Release v1.0.8 already exists; refusing to overwrite."
            exit 1
          fi
          gh release create v1.0.8 pinas.py pinas.py.sha256 \
            --target "$GITHUB_SHA" \
            --title "PiNAS v1.0.8" \
            --notes-file docs/releases/v1.0.8.md \
            --latest
      - name: Verify published assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v1.0.8 --json assets --jq '.assets[].name' | grep -Fx pinas.py
          gh release view v1.0.8 --json assets --jq '.assets[].name' | grep -Fx pinas.py.sha256
