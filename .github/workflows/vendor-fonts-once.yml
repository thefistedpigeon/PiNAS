name: Vendor offline fonts for PiNAS
on:
  push:
    branches: [feature/bundled-ui-fonts]
permissions:
  contents: write
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download pinned font binaries and licences
        run: python3 tools/vendor_fonts.py
      - name: Regenerate single-file PiNAS bundle
        run: python3 tools/build_release.py
      - name: Verify bundle and font regression tests
        run: |
          python3 tools/build_release.py --check
          python3 -m compileall -q src/pinas pinas.py tools tests
          python3 -m unittest discover -s tests -p test_embedded_fonts.py -v
      - name: Commit bundled fonts and generated application
        run: |
          git add assets/fonts/ pinas.py
          if git diff --cached --quiet; then
            echo "Assets already committed."
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Vendor verified offline fonts and regenerate PiNAS'
          git push origin HEAD:feature/bundled-ui-fonts
