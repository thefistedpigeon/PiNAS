name: Build PiNAS v1.2.0 release candidate

on:
  push:
    branches: [release/v1.2.0-official]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build standalone installer
        run: python3 tools/build_release.py
      - name: Verify source, syntax and full regression suite
        run: |
          python3 tools/build_release.py --check
          python3 -m compileall -q src/pinas pinas.py tools tests
          python3 -m unittest discover -s tests -v
      - name: Commit the validated standalone installer
        run: |
          git add pinas.py
          if git diff --cached --quiet; then
            echo 'Standalone installer already matches source.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Regenerate standalone PiNAS v1.2.0 release package'
          git push origin HEAD:release/v1.2.0-official
